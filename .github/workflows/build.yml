# yamllint disable rule:line-length rule:truthy
---
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Created up front so each matrix job can attach its own asset as soon as it
  # is built, instead of a single gather-everything job that loses all assets
  # if one platform fails.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pinned to a full SHA for supply-chain safety (see comments on the
      # build job's action pins for the matching version tags).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Create release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --generate-notes
          fi

  build:
    name: ${{ matrix.target }}
    needs: create-release
    # create-release skips on non-tag pushes; don't let that skip the build.
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            binary: dist/apitofresview/apitofresview
          - os: windows-latest
            target: windows-x86_64
            binary: dist/apitofresview/apitofresview.exe
          - os: macos-latest
            target: macos-arm64
            binary: dist/APiToF Result Viewer.app/Contents/MacOS/apitofresview
    steps:
      # Actions pinned to full commit SHAs (supply-chain hardening). Version
      # tags for reference: checkout@v4, setup-uv@v6, upload-artifact@v4.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        env:
          # Keep Linux bundles from loading a host Intel TCM library.
          CONDA_PINNED_PACKAGES: tbb-devel=${{ runner.os == 'Linux' && '2022.0.0' || '2023.1.0' }}
        with:
          miniforge-version: latest
          activate-environment: explorer-kernels
          environment-file: scripts/explorer-kernels.yml

      - name: Compile Explorer kernels
        shell: bash -el {0}
        run: |
          python -m pip install --no-build-isolation --no-deps "numba @ git+https://github.com/frankier/numba.git@53da7d0f1940e959cf1896b7cc2be8f31b7ac048"
          python scripts/build_explorer_kernels.py
        env:
          NUMBA_DISABLE_TBB: "1"
          NUMBA_DISABLE_OPENMP: "1"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev --group build --no-install-package numba --no-install-package llvmlite

      - name: Identify macOS runner image
        if: runner.os == 'macOS'
        id: runner-image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Cache macOS Matplotlib font index
        if: runner.os == 'macOS' && steps.runner-image.outputs.version != ''
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/matplotlib/fontlist-v*.json
          key: matplotlib-fonts-${{ matrix.target }}-${{ steps.runner-image.outputs.version }}-${{ hashFiles('uv.lock') }}

      - name: Build
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: uv run --no-sync pyinstaller apitofresview.spec --noconfirm --clean

      # A successful PyInstaller run proves very little: its failures are
      # runtime missing-import failures. The self-check starts the frozen
      # binary, serves, and forces the lazy bokeh/panel/holoviews paths.
      - name: Smoke test
        shell: bash
        run: '"${{ matrix.binary }}" --smoke-test'

      - name: Test the frozen spectrogram in Chromium
        shell: bash
        env:
          APITOFRESVIEW_TEST_EXECUTABLE: ${{ matrix.binary }}
        run: |
          uv sync --locked --group build --no-install-package numba --no-install-package llvmlite
          args=(--only-shell)
          if [[ "$RUNNER_OS" == Linux ]]; then
            args+=(--with-deps)
          fi
          uv run --no-sync playwright install "${args[@]}" chromium
          uv run --no-sync pytest tests/test_spectrogram.py::test_label_checkbox_controls_both_views

      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          XZ_OPT: "-4 -T2"
        run: |
          mkdir -p artifacts
          tar -cJf "artifacts/apitofresview-${{ matrix.target }}.tar.xz" \
            -C dist apitofresview

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $dest = "artifacts/apitofresview-${{ matrix.target }}.zip"
          Compress-Archive -Path dist/apitofresview -DestinationPath $dest

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          # ditto, not zip: zip mangles the symlinks inside .app bundles.
          ditto -c -k --keepParent "dist/APiToF Result Viewer.app" \
            "artifacts/apitofresview-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: apitofresview-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0 # The packages are already compressed.
          # These are ~200 MB each; do not keep every branch build forever.
          retention-days: 7

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF#refs/tags/}" artifacts/* --clobber
