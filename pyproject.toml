[project]
name = "apitofsim-resultviewer"
version = "0.3.0"
description = "Read-only web viewer for APi-ToF simulation results"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apitofsim[plot]",
    "bokeh==3.10",
    "duckdb>=1.5.5",
    "mplbed>=0.3.1",
    "numba>=0.68.0",
    "numpy>=2.0.0",
    "panel==1.10.0a3",
    "starlette>=1.4.1",
    "starlette-htmx>=0.1.1",
    "uvicorn[standard]>=0.52.1",
    # Arrow sidecar readers require true shared file locks on Windows.
    "portalocker[win32]>=4.4.2; sys_platform == 'win32'",
    # No native window on Linux: pywebview needs PyGObject/WebKitGTK there,
    # which cannot be frozen reliably, so we open the system browser instead.
    "pywebview>=6.2.1; sys_platform != 'linux'",
    "workingtitle",
    "polars>=2.0.0",
]

[project.scripts]
apitofresview = "apitofresview.cli:main"

[dependency-groups]
build = [
    "pyinstaller>=6.21.0",
    "pyinstaller-hooks-contrib",
]

dev = [
    "pytest>=9.0.2",
    "pytest-playwright>=0.7.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

# The project name is "apitofsim-resultviewer" but the importable package is
# named apitofresview; tell the build backend which module directory to ship.
[tool.uv.build-backend]
module-name = "apitofresview"

[tool.uv]
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
# Track the scoped Arrow reader until the next apitofsim release.
apitofsim = { git = "https://github.com/VilmaLab/apitofsim.git", branch = "main" }
workingtitle = { git = "https://github.com/frankier/workingtitle.git" }

[build-system]
requires = ["uv_build >= 0.11.7, <0.12.0"]
build-backend = "uv_build"
