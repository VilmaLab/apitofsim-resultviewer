# yamllint disable rule:line-length rule:truthy
---
name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (supply-chain hardening). Version
      # tags for reference: checkout@v4, setup-uv@v6.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.14"
          enable-cache: true

      # The draft builds apitofsim from trunk. Remove this step with the wheel pin.
      - name: Install oneTBB for the apitofsim source build
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/VilmaLab/apitofsim/2d8a30df93c94787162e5f84495307a7b863af4b/ci/install_tbb.sh \
            -o "$RUNNER_TEMP/install_tbb.sh"
          sudo bash "$RUNNER_TEMP/install_tbb.sh"

      - name: Install dependencies
        run: uv sync --locked --group dev

      # The browser tests drive a real Chromium via pytest-playwright.
      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run tests
        run: uv run pytest
