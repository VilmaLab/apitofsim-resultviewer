[project]
name = "apitofsim-resultviewer"
version = "0.1.0"
description = "Read-only web viewer for APi-ToF simulation results"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apitofsim[plot]",
    "bokeh==3.10",
    "duckdb>=1.5.5",
    "mplbed>=0.3.0",
    "panel==1.10.0a3",
    "starlette>=1.4.1",
    "starlette-htmx>=0.1.1",
    "uvicorn[standard]>=0.52.1",
    # No native window on Linux: pywebview needs PyGObject/WebKitGTK there,
    # which cannot be frozen reliably, so we open the system browser instead.
    "pywebview>=6.2.1; sys_platform != 'linux'",
]

[project.scripts]
apitofresview = "apitofresview.cli:main"

[dependency-groups]
build = [
    "pyinstaller>=6.21.0",
    "pyinstaller-hooks-contrib",
]

dev = [
    "pytest>=9.0.2",
    "pytest-playwright>=0.7.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

# The project name is "apitofsim-resultviewer" but the importable package is
# named apitofresview; tell the build backend which module directory to ship.
[tool.uv.build-backend]
module-name = "apitofresview"

[tool.uv]
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
apitofsim = [
  { url = "https://github.com/VilmaLab/apitofsim/releases/download/v0.0.16/apitofsim-0.0.16-cp313-abi3-manylinux_2_34_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { url = "https://github.com/VilmaLab/apitofsim/releases/download/v0.0.16/apitofsim-0.0.16-cp313-abi3-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
  { url = "https://github.com/VilmaLab/apitofsim/releases/download/v0.0.16/apitofsim-0.0.16-cp313-abi3-win_amd64.whl", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
  # Fallback for platforms outside [tool.uv] environments: every source in a
  # list needs a marker and uv's parser has no `not`, so the complement has to
  # be written with De Morgan (or the sdist used as the only source).
  # { url = "https://github.com/VilmaLab/apitofsim/archive/refs/tags/v0.0.16.tar.gz", marker = "(sys_platform != 'linux' or platform_machine != 'x86_64') and (sys_platform != 'darwin' or platform_machine != 'arm64') and (sys_platform != 'win32' or platform_machine != 'AMD64')" },
]

[build-system]
requires = ["uv_build >= 0.11.7, <0.12.0"]
build-backend = "uv_build"
