{% extends "base.html" %}

{% block title %}Spectrogram{% endblock %}

{% block content %}
    <div x-data="{ current_tab: $persist('matplotlib') }">
        <nav class="bg-slate-100 flex flex-wrap w-full">
            {% for variant in ['matplotlib', 'bokeh'] %}
                <div class="text-nowrap px-4 py-2 hover:bg-slate-300" :class="{ 'bg-slate-300': current_tab === '{{ variant }}' }">
                    <a href="#{{ variant }}" @click="current_tab = '{{ variant }}'">
                        {{ variant|capitalize }}
                    </a>
                </div>
            {% endfor %}
        </nav>

        <div x-show="current_tab === 'matplotlib'">
            {{ spectrogram_mpl|safe }}
        </div>

        <div x-show="current_tab === 'bokeh'" class="overflow-x-auto p-4">
            <div class="mx-auto w-max">{{ spectrogram_bokeh|safe }}</div>
        </div>
        <form method="get" action="{{ url_for(route) }}" class="m-4" x-data="{ show_labels: {{ labels|tojson }} }">
            <input type="hidden" name="experiment" value="{{ experiment }}">
            <input type="hidden" name="cluster" value="{{ cluster }}">
            <input type="hidden" name="labels" :value="show_labels">
            <label class="inline-flex items-center gap-2">
                <input type="checkbox" x-model="show_labels" @change="$nextTick(() => $el.form.requestSubmit())" {% if labels %}checked{% endif %}>
                Show labels
            </label>
        </form>
    </div>
{% endblock %}
